<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./style/nav-more-left.css" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/nav-top.css" />
    <link rel="stylesheet" href="./style/nav-left.css" />
    <link rel="stylesheet" href="./style/nav-top-mails.css" />
    <link rel="stylesheet" href="./style/nav-right.css" />
  </head>
  <body>
    <nav class="nav-left-left">
      <button><img src="./assets/hamburger.svg" alt="hamburger icon" /></button>
      <button>
        <img src="./assets/mail-nav.png" alt="mail-nav" />
        <span>Mail</span>
      </button>
      <button>
        <img src="./assets/chat-nav.png" alt="chat-nav" />
        <span>Chat</span>
      </button>
      <button>
        <img src="./assets/meet-nav.png" alt="meet-nav" />
        <span>Meet</span>
      </button>
    </nav>
    <div>
      <nav class="nav-top">
        <button>
          <img
            src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r7.png"
            alt="./assets/gmail-logo.png"
          />
        </button>
        <div class="search">
          <button>
            <img src="./assets/search.png" alt="search icon" />
          </button>
          <input type="text" placeholder="Przeszukaj pocztę" />
          <button>
            <img src="./assets/search-settings.png" alt="search-settings" />
          </button>
        </div>
        <div class="right-elements">
          <div class="online">
            <div id="circle"></div>
            <span>Online</span>
            <div id="arrow"></div>
          </div>
          <button>
            <img src="./assets/help.png" alt="help-icon" />
          </button>
          <button>
            <img src="./assets/setting.png" alt="settings-icon" />
          </button>
          <button>
            <img src="./assets/studio.svg" alt="studio-icon" />
          </button>
          <button>
            <img src="./assets/menu.png" alt="menu-icon" />
          </button>
          <button>
            <span>K</span>
          </button>
        </div>
      </nav>
      <div>
        <nav class="nav-left">
          <button>
            <img src="./assets/pencil.png" alt="penicl icon" />
            <span>Utwórz</span>
          </button>
          <ul>
            <li>
              <button>
                <img src="./assets/received.png" alt="received icon" />
                <span>Odebrane</span>
                <span>99+</span>
              </button>
            </li>
            <li>
              <button>
                <img src="./assets/star.png" alt="star icon" />
                <span>Oznaczone gwiazdką</span>
              </button>
            </li>
            <li>
              <button>
                <img src="./assets/clock.png" alt="clock icon" />
                <span>Odłożone</span>
              </button>
            </li>
            <li>
              <button>
                <img src="./assets/send.png" alt="send icon" />
                <span>Wysłane</span>
              </button>
            </li>
            <li>
              <button>
                <img src="./assets/draft.png" alt="draft icon" />
                <span>Wersje robocze</span>
              </button>
            </li>
            <li>
              <button>
                <img src="./assets/category.png" alt="category icon" />
                <span>Kategorie</span>
              </button>
            </li>
            <li>
              <button>
                <div></div>
                <span>Więcej</span>
              </button>
            </li>
            <!--Jeśli mi się zachce to mogę zrobić po rozwinięciu listy więcj kategori -->
          </ul>
          <div>
            <span>Etykiety</span>
            <button>
              <span>+</span>
            </button>
          </div>
        </nav>
        <nav class="nav-top-mails">
          <button><div></div></button>
          <button><div class="arrow-top"></div></button>
          <button>
            <img src="./assets/refresh.png" alt="refresh icon" />
          </button>
          <button>
            <img src="./assets/3-dots.png" alt="3-dots icon" />
          </button>
          <button>
            <span>1-50 z 186</span>
          </button>
          <button><div class="arrow-top"></div></button>
          <button><div class="arrow-top"></div></button>
        </nav>
        <main class="mails"></main>
        <nav class="nav-right">
          <button>
            <img src="./assets/callendar.png" alt="callendar icon" />
          </button>
          <button>
            <img src="./assets/keep.png" alt="keep icon" />
          </button>
          <button>
            <img src="./assets/tasks.png" alt="tasks icon" />
          </button>
          <button>
            <img src="./assets/contacts.png" alt="contacts icon" />
          </button>
          <hr />
          <button>
            <img src="./assets/trello.png" alt="trello icon" />
          </button>
          <button>
            <img src="./assets/plus.png" alt="plus icon" />
          </button>
          <button>
            <div></div>
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
