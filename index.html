<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail</title>
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./style/nav-more-left.css" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/nav-top.css" />
    <link rel="stylesheet" href="./style/nav-left.css" />
  </head>
  <body>
    <nav class="nav-left-left">
      <button><img src="./assets/hamburger.svg" alt="hamburger icon" /></button>
      <button>
        <img src="./assets/mail-nav.png" alt="mail-nav" />
        <span>Mail</span>
      </button>
      <button>
        <img src="./assets/chat-nav.png" alt="chat-nav" />
        <span>Chat</span>
      </button>
      <button>
        <img src="./assets/meet-nav.png" alt="meet-nav" />
        <span>Meet</span>
      </button>
    </nav>
    <nav class="nav-top">
      <button>
        <img
          src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r7.png"
          alt="./assets/gmail-logo.png"
        />
      </button>
      <div class="search">
        <button>
          <img src="./assets/search.png" alt="search icon" />
        </button>
        <input type="text" placeholder="Przeszukaj pocztę" />
        <button>
          <img src="./assets/search-settings.png" alt="search-settings" />
        </button>
      </div>
      <div class="right-elements">
        <div class="online">
          <div id="circle"></div>
          <span>Online</span>
          <div id="arrow"></div>
        </div>
        <button>
          <img src="./assets/help.png" alt="help-icon" />
        </button>
        <button>
          <img src="./assets/setting.png" alt="settings-icon" />
        </button>
        <button>
          <img src="./assets/studio.svg" alt="studio-icon" />
        </button>
        <button>
          <img src="./assets/menu.png" alt="menu-icon" />
        </button>
        <button>
          <span>K</span>
        </button>
      </div>
    </nav>
    <nav class="nav-left">
      <button>
        <img src="./assets/pencil.png" alt="penicl icon" />
        <span>Utwórz</span>
      </button>
      <ul>
        <li>
          <img src="./assets/received.png" alt="received icon" />
          <span>Odebrane</span>
          <span>99+</span>
        </li>
        <li>
          <img src="./assets/star.png" alt="star icon" />
          <span>Oznaczone gwiazdką</span>
        </li>
        <li>
          <img src="./assets/star.png" alt="star icon" />
          <span>Odłożone</span>
        </li>
        <li>
          <img src="./assets/send.png" alt="send icon" />
          <span>Wysłane</span>
        </li>
        <li>
          <img src="./assets/draft.png" alt="draft icon" />
          <span>Wersje robocze</span>
        </li>
        <li>
          <img src="./assets/category.png" alt="category icon" />
          <span>Kategorie</span>
        </li>
        <li>
          <div></div>
          <span>Więcej</span>
        </li>
      </ul>
      <div>
        <span>Etykiety</span>
        <span>+</span>
      </div>
    </nav>
  </body>
</html>
